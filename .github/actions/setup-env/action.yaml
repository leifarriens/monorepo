name: "Setup environment"
description: "Install node, pnpm & setup turbo cache (needs actions/checkout)"

runs:
  using: "composite"
  steps:
    - name: 🦆 Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: 🛠️ Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: "mise.toml"
        cache: "pnpm"

    - name: 📦 Install deps
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🏎️ Configure turbo
      shell: bash
      run: |
        pnpm turbo telemetry disable

    - name: 🗂️ Setup turbo cache
      uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
