packages:
  - "apps/*"
  - "packages/*"
  - "configs/**"
  - "!**/test/**"

catalog:
  "@vitest/coverage-v8": ^5.0.1
  eslint: ^10.10.0
  typescript: ^7.0.0
  vitest: ^5.0.1

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: false
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.4"
  - "@turbo/darwin-arm64@2.11.4"
  - "@turbo/linux-64@2.11.4"
  - "@turbo/linux-arm64@2.11.4"
  - "@turbo/windows-64@2.11.4"
  - "@turbo/windows-arm64@2.11.4"
  - turbo@2.11.4
