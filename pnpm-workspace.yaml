packages:
  - "apps/*"
  - "packages/*"
  - "configs/**"
  - "!**/test/**"

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: false
allowBuilds:
  esbuild: true

catalog:
  "@vitest/coverage-v8": ^4.1.11
  eslint: ^10.9.1
  typescript: ~6.0.3
  "typescript-7": "npm:typescript@^7.0.2"
  vitest: ^4.1.11
